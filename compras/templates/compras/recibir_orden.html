{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recepcionar OC-{{ orden.pk }} - Mascott</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/perfil.css' %}"/>
</head>
<body>
  <button class="hamburguesa" id="btnHamburguesa"><i class="bi bi-list"></i></button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="perfil-sidebar" id="sidebar">
    <a href="{% url 'inicio' %}" class="sidebar-logo"><i class="bi bi-heart-pulse-fill"></i> Mascott</a>
    <nav class="sidebar-nav">
      <a href="{% url 'lista_ordenes' %}" class="activo"><i class="bi bi-cart-fill"></i> Compras</a>
      <a href="{% url 'lista_lotes' %}"><i class="bi bi-box-fill"></i> Lotes</a>
    </nav>
    <div class="sidebar-sep"></div>
    <a href="{% url 'logout' %}" class="sidebar-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </aside>

  <main class="perfil-main">
    <div class="perfil-bienvenida">
      <h1 class="perfil-titulo"><i class="bi bi-box-arrow-in-down me-2"></i>Recepcionar OC-{{ orden.pk }}</h1>
    </div>

    <div class="perfil-seccion">
      <form method="post">
        {% csrf_token %}
        {% for item in orden.items.all %}
        <div class="row g-2 mb-3 align-items-center border-bottom pb-3">
          <div class="col-12 col-md-3 fw-bold">{{ item.producto.nombre }}</div>
          <input type="hidden" name="producto[]" value="{{ item.producto.pk }}"/>
          <div class="col-6 col-md-2">
            <label class="form-label small">Cantidad recibida</label>
            <input type="number" name="cantidad[]" value="{{ item.cantidad }}" min="0" class="form-control form-control-sm"/>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small">Número de lote</label>
            <input type="text" name="lote[]" class="form-control form-control-sm" placeholder="Ej: LOT-2026-01"/>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small">Fecha de vencimiento</label>
            <input type="date" name="vence[]" class="form-control form-control-sm"/>
          </div>
        </div>
        {% endfor %}

        <div class="mb-3">
          <label class="form-label fw-bold">Notas de recepción</label>
          <textarea name="notas" class="form-control" rows="2"></textarea>
        </div>

        <button type="submit" class="btn-guardar">
          <i class="bi bi-check-circle-fill me-2"></i>Confirmar recepción e ingresar al inventario
        </button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const btn=document.getElementById('btnHamburguesa'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('sidebarOverlay');
    btn.addEventListener('click',()=>{sidebar.classList.toggle('abierto');overlay.classList.toggle('activo');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('abierto');overlay.classList.remove('activo');});
  </script>
</body>
</html>
