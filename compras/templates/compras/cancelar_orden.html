{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Cancelar OC-{{ orden.pk }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/perfil.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/base_auth.css' %}"/>
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5" style="background:#e8f0f7;">
    <div class="auth-card text-center" style="max-width:420px;">
      <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
      <h1 class="auth-title">¿Cancelar OC-{{ orden.pk }}?</h1>
      <p class="auth-desc">Esta acción no se puede deshacer. La orden quedará como cancelada.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button type="submit" class="auth-btn" style="background:#dc2626;">Sí, cancelar</button>
        <a href="{% url 'lista_ordenes' %}" class="auth-btn" style="background:#6b7280;">No, volver</a>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
