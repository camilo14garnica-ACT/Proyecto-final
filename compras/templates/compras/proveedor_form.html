{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ titulo }} - Mascott</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/perfil.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/base_auth.css' %}"/>
</head>
<body>
  <aside class="perfil-sidebar">
    <a href="{% url 'inicio' %}" class="sidebar-logo"><i class="bi bi-heart-pulse-fill"></i> Mascott</a>
    <nav class="sidebar-nav">
      <a href="{% url 'lista_ordenes' %}"><i class="bi bi-cart-fill"></i> Compras</a>
      <a href="{% url 'lista_proveedores' %}" class="activo"><i class="bi bi-truck"></i> Proveedores</a>
    </nav>
    <div class="sidebar-sep"></div>
    <a href="{% url 'logout' %}" class="sidebar-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </aside>

  <main class="perfil-main">
    <div class="perfil-bienvenida">
      <h1 class="perfil-titulo">{{ titulo }}</h1>
      <a href="{% url 'lista_proveedores' %}" class="btn-agendar-cita" style="background:#6b7280;"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>

    <div class="perfil-seccion" style="max-width:520px;">
      <form method="post" class="auth-form">
        {% csrf_token %}
        <p><label>Nombre <span class="text-danger">*</span></label><input type="text" name="nombre" required placeholder="Nombre del proveedor"/></p>
        <p><label>Contacto</label><input type="text" name="contacto" placeholder="Nombre del contacto"/></p>
        <p><label>Teléfono</label><input type="text" name="telefono" placeholder="Ej: 310 000 0000"/></p>
        <p><label>Email</label><input type="email" name="email" placeholder="proveedor@correo.com"/></p>
        <p><label>Dirección</label><input type="text" name="direccion" placeholder="Dirección física"/></p>
        <button type="submit" class="auth-btn"><i class="bi bi-check-circle-fill me-2"></i>Guardar proveedor</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
