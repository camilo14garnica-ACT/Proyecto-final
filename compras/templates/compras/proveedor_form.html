{% extends 'partials/base-admin.html' %}
{% block title %}{{ titulo }} – Mascott{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="h3 mb-0"><i class="bi bi-truck me-2 text-primary"></i>{{ titulo }}</h1>
  </div>
  <a href="{% url 'lista_proveedores' %}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="card shadow-sm" style="max-width:560px;">
  <div class="card-header bg-dark text-white">
    <i class="bi bi-person-lines-fill me-1"></i>Datos del proveedor
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control" placeholder="Nombre del proveedor" required/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Contacto</label>
        <input type="text" name="contacto" class="form-control" placeholder="Nombre de la persona de contacto"/>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label fw-bold">Teléfono</label>
          <input type="text" name="telefono" class="form-control" placeholder="310 000 0000"/>
        </div>
        <div class="col-6">
          <label class="form-label fw-bold">Email</label>
          <input type="email" name="email" class="form-control" placeholder="proveedor@correo.com"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">Dirección</label>
        <input type="text" name="direccion" class="form-control" placeholder="Dirección física"/>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'lista_proveedores' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle-fill me-1"></i>Guardar proveedor
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
