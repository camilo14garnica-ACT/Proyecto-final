{% extends "usuarios/base.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block usuarios_content %}
  <section class="auth-card">
    <h1>Recuperar contraseña</h1>
    <p>Escribe tu correo y te enviaremos un enlace para restablecerla.</p>
    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button button-primary">Enviar enlace</button>
    </form>
  </section>
{% endblock usuarios_content %}
