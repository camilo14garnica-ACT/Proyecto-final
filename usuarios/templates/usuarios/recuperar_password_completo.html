{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contraseña restablecida - Veterinaria Mascott</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- CSS base de autenticación -->
  <link rel="stylesheet" href="../../../../static/css/usuarios/base_auth.css"/>
  <!-- CSS específico de esta página -->
  <link rel="stylesheet" href="../../../../static/css/usuarios/recuperar_password_completo.css"/>
</head>

<body>

  <!-- ============================================================
       PASO 4: Contraseña restablecida exitosamente
       Pantalla final del flujo de recuperación
  ============================================================ -->

  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">

        <!-- Enlace volver — encima de la tarjeta -->
        <a href="{% url 'inicio' %}" class="auth-volver">← Volver al inicio</a>

        <!-- Tarjeta blanca -->
        <div class="auth-card text-center">

          <!-- Logo sin ícono -->
          <div class="auth-logo">
            <span>Mascott</span>
          </div>

          <!-- Ícono de éxito -->
          <div class="completo-icono">
            <i class="bi bi-check-circle-fill"></i>
          </div>

          <!-- Título y mensaje -->
          <h1 class="auth-title">¡Contraseña restablecida!</h1>
          <p class="auth-desc">
            Tu contraseña fue cambiada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
          </p>

          <!-- Separador -->
          <div class="completo-separador"></div>

          <!-- Botón ir al login -->
          <a href="{% url 'login' %}" class="auth-btn d-block text-decoration-none">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión ahora
          </a>

          <!-- Enlace al inicio -->
          <p class="auth-footer mt-3">
            ¿Quieres explorar primero?
            <a href="{% url 'inicio' %}">Ir al inicio</a>
          </p>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
