{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Veterinaria Mascott{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/usuarios/base_auth.css' %}">
  {% block auth_css %}{% endblock auth_css %}
</head>
<body class="auth-body">
  <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
        <a href="{% url 'inicio' %}" class="auth-volver">← Volver al inicio</a>
        <section class="auth-card">
          {% block auth_content %}{% endblock auth_content %}
        </section>
      </div>
    </div>
  </main>
  <!-- Modulo de Accesibilidad -->
  <link rel="stylesheet" href="{% static 'css/modulos/accesibilidad.css' %}">
  {% include 'accesibilidad/widget.html' %}
    {% include 'accesibilidad/chatbot_widget.html' %}
  <script src="{% static 'js/modulos/accesibilidad.js' %}"></script>

</body>
</html>
