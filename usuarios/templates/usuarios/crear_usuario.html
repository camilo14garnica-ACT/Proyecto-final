{% extends "usuarios/base_auth.html" %}

{% block title %}Crear usuario - Veterinaria Mascott{% endblock title %}

{% block auth_content %}
  <h1 class="auth-title">Crear usuario</h1>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="auth-btn">Crear usuario</button>
  </form>

  <p class="auth-footer">
    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
  </p>
{% endblock auth_content %}
