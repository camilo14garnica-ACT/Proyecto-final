{% extends "usuarios/base_auth.html" %}

{% block title %} Crear Usuarios{% endblock title %} 

{% block auth_content %}
  <h1 class="h3 text-center mb-4"> Crear Usuarios </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary w-100"> Crear Usuarios </button>
  </form>


  <p class="text-center mt-3 mb-0"> 
    ¿Ya tienes cuenta? <a href="{% url "login" %}"> Inicia sesion </a>
  </p>
{% endblock auth_content %}
