{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña - Veterinaria Mascott</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{% static 'css/usuarios/base_auth.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/usuarios/recuperar_password_confirmar.css' %}"/>
</head>
<body>

  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">

        <div class="auth-card">

          <!-- Logo -->
          <div class="auth-logo">
            <span>Mascott</span>
          </div>

          <!-- Ícono de candado -->
          <div class="confirmar-icono text-center">
            <i class="bi bi-lock-fill"></i>
          </div>

          <h1 class="auth-title">Nueva contraseña</h1>
          <p class="auth-desc">Escribe y confirma tu nueva contraseña. Debe tener al menos 8 caracteres.</p>

          <!-- Formulario nueva contraseña -->
          <form method="post" action="{% url 'recuperar_password_nueva' %}" class="auth-form">
            {% csrf_token %}

            <!-- Campo nueva contraseña -->
            <p>
              <label for="nueva_password">Nueva contraseña</label>
              <input type="password" id="nueva_password" name="nueva_password"
                     placeholder="Mínimo 8 caracteres"
                     minlength="8" required
                     autocomplete="new-password" />
            </p>

            <!-- Campo confirmar contraseña -->
            <p>
              <label for="confirmar_password">Confirmar contraseña</label>
              <input type="password" id="confirmar_password" name="confirmar_password"
                     placeholder="Repite la contraseña"
                     minlength="8" required
                     autocomplete="new-password" />
            </p>

            {% if error %}
              <p class="auth-error">{{ error }}</p>
            {% endif %}

            <button type="submit" class="auth-btn">
              <i class="bi bi-check-circle-fill me-2"></i>Guardar nueva contraseña
            </button>
          </form>

          <p class="auth-footer mt-3">
            <a href="{% url 'login' %}">← Volver al inicio de sesión</a>
          </p>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
