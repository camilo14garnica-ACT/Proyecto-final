{% load static %}
<!-- Hojas de estilo del Módulo de Accesibilidad -->
<link rel="stylesheet" href="{% static 'vendor/accessibility/accessibility-widget.css' %}">
<link rel="stylesheet" href="{% static 'css/modulos/accesibilidad.css' %}">

<!-- Configuración del Módulo de Accesibilidad Mascott -->
<script>
    window.ACCESSIBILITY_WIDGET_CONFIG = {
        lang: {
            accessibilityMenu: 'Menú de Accesibilidad Mascott',
            closeAccessibilityMenu: 'Cerrar Menú de Accesibilidad',
            accessibilityTools: 'Herramientas de Accesibilidad',
            resetAllSettings: 'Restablecer Ajustes',
            screenReader: 'Lector de Pantalla (TTS)',
            voiceCommand: 'Comandos de Voz',
            textSpacing: 'Espaciado de Texto',
            pauseAnimations: 'Pausar Animaciones',
            hideImages: 'Ocultar Imágenes',
            dyslexiaFriendly: 'Fuente para Dislexia',
            biggerCursor: 'Cursor Agrandado',
            lineHeight: 'Altura de Línea',
            fontSelection: 'Tipo de Fuente',
            colorFilter: 'Filtro de Color',
            textAlign: 'Alineación de Texto',
            textSize: 'Tamaño de Texto',
            highContrast: 'Alto Contraste',
            defaultFont: 'Fuente Predeterminada',
            noFilter: 'Sin Filtro',
            default: 'Predeterminado',
            screenReaderOn: 'Lector de pantalla activado',
            screenReaderOff: 'Lector de pantalla desactivado',
            voiceControlActivated: 'Control de voz activado',
            notSupportedBrowser: 'no es compatible con este navegador',
            close: 'Cerrar',
            reset: 'Restablecer',
            saturation: 'Saturación',
            selectLanguage: 'Idioma'
        },
        colors: {
            primary: '#005a9c',         // Azul oficial de la Norma Internacional de Accesibilidad (ISO 7001 / ISA)
            secondary: '#ffffff',       // Blanco contraste (cumple WCAG AAA)
            optionBg: '#ffffff',        // Fondo de opciones
            optionText: '#212529',      // Texto oscuro legible
            optionIcon: '#005a9c'       // Icono azul de accesibilidad
        },
        button: {
            size: '56px',
            borderRadius: '50%',
            iconSize: '30px',
            shadow: '0 8px 24px rgba(0, 90, 156, 0.45)'
        },
        widgetPosition: {
            side: 'right',
            right: '24px',
            left: '24px',
            bottom: '24px'
        }
    };

    // Forzar idioma en español si no existe configuración previa
    if (!localStorage.getItem('accessibilityWidgetLanguage')) {
        localStorage.setItem('accessibilityWidgetLanguage', 'es');
    }
</script>

<!-- Scripts del Módulo de Accesibilidad -->
<script src="{% static 'vendor/accessibility/accessibility-widgets.js' %}"></script>
<script src="{% static 'js/modulos/accesibilidad.js' %}"></script>
